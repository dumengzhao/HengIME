name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# librime 的下载地址在各步骤里写死：1.17.0 release，源码点 33e7814。
# 写成变量曾导致三个平台的安装步骤一起失败，而拉取 CI 日志需要仓库 admin
# 权限、看不到变量展开后的实际值，不如直接内联。
# 对应关系见 third_party/librime/version-info.txt。

jobs:
  # 三平台共用：编 core、跑单测、过 ABI 全链路。
  # 各job 唯一的差别是「librime 从哪来」——core 的 build.rs 按 target_os 分三条路：
  #   Windows/macOS 强制要求 third_party/librime/dist/lib 里有官方预编译产物；
  #   Linux 有本地产物就用，没有则链发行版包 librime-dev。
  core:
    name: core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Windows runner 上 run 的默认 shell 是 pwsh，而这个 job 的步骤统一用 bash 语法
    # （set -o pipefail / PIPESTATUS / { } >> $GITHUB_STEP_SUMMARY）。
    # 不显式声明的话，Windows 会把 `set -o pipefail` 当成 PowerShell 命令而报错。
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
          - name: Windows
            os: windows-2022
            rust-target: x86_64-pc-windows-msvc
          - name: macOS
            os: macos-15
            rust-target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: 安装 librime（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 7-Zip 预装在 windows-2022 上但不在 PATH 里，必须用完整路径。
          # 内置的 tar.exe 不支持 7z 的 LZMA 编码，替代不了。
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw "runner 上找不到 7z.exe" }
          $url = 'https://github.com/rime/librime/releases/download/1.17.0/rime-33e7814-Windows-msvc-x64.7z'
          Invoke-WebRequest -Uri $url -OutFile rime.7z
          & $sevenZip x rime.7z "-othird_party/librime" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z 解压失败，退出码 $LASTEXITCODE" }
          if (-not (Test-Path third_party/librime/dist/lib/rime.lib)) {
            throw "rime.lib 缺失，官方包结构与预期不符"
          }
          # core 链的是 rime.lib（导入库），产物 heng_core.dll 与单测 exe 运行时
          # 仍要加载 rime.dll。测试 exe 落在 target/release/deps/，那里没有 rime.dll，
          # 只能在 PATH 里补一份，否则 cargo test 报「找不到依赖」。
          "$env:GITHUB_WORKSPACE\third_party\librime\dist\lib" | Out-File -Append $env:GITHUB_PATH

      - name: 安装 librime（macOS）
        if: runner.os == 'macOS'
        run: |
          curl -fL --retry 3 -o rime.tar.bz2 \
            "https://github.com/rime/librime/releases/download/1.17.0/rime-33e7814-macOS-universal.tar.bz2"
          mkdir -p third_party/librime
          # 不用 set -e：出错时要自己给消息。bzip2 支持在 runner 上是有的，
          # 但留python3 兜底以防镜像差异。
          if ! tar xjf rime.tar.bz2 -C third_party/librime; then
            echo "tar xjf 失败，改用 python3"
            python3 -c "import tarfile; tarfile.open('rime.tar.bz2').extractall('third_party/librime')"
          fi
          LIB=third_party/librime/dist/lib
          ls -l "$LIB"
          # 包里 librime.dylib 与 librime.1.dylib 是指向 librime.<版本>.dylib 的符号链接。
          # core/build.rs 检查 librime.dylib，缺符号链接时 cargo build 直接 panic。
          REAL=$(cd "$LIB" && ls librime.1.*.dylib | head -1)
          echo "实体库: $REAL"
          [ -e "$LIB/librime.1.dylib" ] || ln -s "$REAL" "$LIB/librime.1.dylib"
          [ -e "$LIB/librime.dylib" ] || ln -s librime.1.dylib "$LIB/librime.dylib"
          test -f "$LIB/librime.dylib"
          # 官方包的 dylib install_name 不是 @rpath，测试二进制与 heng-cli 运行时
          # 找不到它就会 dyld 报错。写进 GITHUB_ENV 让后续步骤都带上。
          echo "DYLD_LIBRARY_PATH=$GITHUB_WORKSPACE/third_party/librime/dist/lib:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$GITHUB_WORKSPACE/third_party/librime/dist/lib" >> "$GITHUB_ENV"

      - name: 安装 librime（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # librime-dev 提供 librime.so 与头文件；
          # libfontconfig1-dev 是 yeslogic-fontconfig-sys 的构建期依赖，
          # 由 slint 的 software-renderer-systemfonts feature 引入，缺它 cargo build 会失败。
          # x11rb 是纯 Rust，不需要额外的 X11 开发包。
          sudo apt-get install -y librime-dev cmake pkg-config libfontconfig1-dev

      - name: 安装 Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        # librime 的官方 Windows 产物是 MSVC 的 rime.lib。windows-2022 runner 的
        # 默认 host 就是 msvc，这里把三个平台的 host 显式写进 job 摘要——
        # 失败时能确认工具链是不是预期的那个（targets 参数只装额外 target，
        # 不切host）。
        with:
          targets: ${{ matrix.rust-target }}

      - name: 记录工具链
        run: |
          {
            echo "### host 与target"
            echo '```'
            rustc -vV
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 编译 core
        run: |
          set -o pipefail
          # 工具链写进 job 摘要：MSVC 与 GNU 工具链在链接 librime 时行为不同，
          # 失败时需要知道 runner 用的是哪个。librime 的官方 Windows 产物是
          # MSVC 的 rime.lib，用 GNU 工具链会链接失败。
          {
            echo "### toolchain"
            echo '```'
            rustc -vV
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo build --release -p heng-core 2>&1 | tee build.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            {
              echo "### cargo build 失败，末尾 60 行"
              echo '```'
              tail -60 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 再打一遍到 stdout：job 摘要只能从 UI 看，
            # 而拉取 CI 日志需要仓库 admin 权限
            echo "::error::cargo build 失败，详见 job summary 与末尾 60 行"
            exit 1
          fi

      - name: 单测
        run: |
          set -o pipefail
          # core/src/ui.rs 里 5 个测试涉UI 后端。macOS runner 是无头环境，
          # 没有窗口系统可用，失败时需要看到具体是哪个断言。
          cargo test --release -p heng-core --lib 2>&1 | tee test.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            {
              echo "### cargo test 失败，末尾 60 行"
              echo '```'
              tail -60 test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "^(test |failures:|---- )" test.log | head -40 || true
            exit 1
          fi

      - name: 铺运行时配置
        if: runner.os == 'Linux'
        run: |
          # runtime/ 被 gitignore，CI 上不存在，而 abitest 的断言要读配置与词库。
          # 用 HENG_RUNTIME 指向现铺的目录。
          #
          # 雾凇的部分（词典、lua 模块、符号表、opencc、7 个双拼 schema）不在仓库里，
          # 也不该入库 —— 它们跟着上游走，直接取 full.zip。入库会与上游脱节，
          # 而且那批文件里没有任何本项目的改动（实测与本机逐文件 md5 相同）。
          # 词典是持续更新的（上游一个月至少两次增改词汇与权重），锁版本反而是错的。
          set -euo pipefail
          mkdir -p ci-runtime/rime-shared ci-runtime/rime-user
          curl -fL --retry 3 -o rime-full.zip \
            "https://github.com/iDvel/rime-ice/releases/latest/download/full.zip"
          unzip -q rime-full.zip -d ci-runtime/rime-shared

          # 本项目改过的三个配置覆盖在雾凇原版之上。
          # schema_list 只留 rime_ice：其余 8 个方案（t9 + 7 个双拼）本机在用但
          # 未入库，librime 遇到缺失的 schema 会让整个部署以 failure 收场。
          python3 tools/ci/make_ci_default.py \
            ci-runtime/rime-shared/default.yaml \
            ci-runtime/rime-shared/default.yaml
          cp patches/rime-ice.schema.yaml    ci-runtime/rime-shared/rime_ice.schema.yaml
          cp patches/rime-weasel.yaml        ci-runtime/rime-shared/weasel.yaml
          cp config-center/shared/heng.yaml  ci-runtime/rime-shared/heng.yaml

          ls ci-runtime/rime-shared/
          test -d ci-runtime/rime-shared/lua
          test -d ci-runtime/rime-shared/cn_dicts
          test -f ci-runtime/rime-shared/rime_ice.dict.yaml
          grep -v '^#' ci-runtime/rime-shared/default.yaml | grep -c 'schema: rime_ice'

      - name: ABI 全链路
        env:
          HENG_RUNTIME: ${{ github.workspace }}/ci-runtime
        run: |
          set -o pipefail
          {
            echo "### 运行时目录"
            echo '```'
            ls -R "$HENG_RUNTIME" | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo run --release -p heng-cli -- abitest 2>&1 | tee abitest.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            {
              echo "### abitest 失败，末尾 60 行"
              echo '```'
              tail -60 abitest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 编译 heng-cli
        run: cargo build --release -p heng-cli

  # Windows 外壳：weasel改造。链条最长——补丁重放 + boost + MSBuild + 导入库重建。
  shell-windows:
    name: 外壳 Windows (weasel)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: 安装 librime
        shell: pwsh
        run: |
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw "runner 上找不到 7z.exe" }
          Invoke-WebRequest -Uri 'https://github.com/rime/librime/releases/download/1.17.0/rime-33e7814-Windows-msvc-x64.7z' -OutFile rime.7z
          & $sevenZip x rime.7z "-othird_party/librime" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z 解压失败，退出码 $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path third_party/externals | Out-Null
          Copy-Item third_party/librime/dist/lib/rime.dll third_party/externals/ -Force

      - name: 克隆 weasel 并重放补丁
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 基线是托盘刷新修复 commit d73f629，在 tag 0.17.4 之后。用tag 会 context 对不上。
          git clone --depth 1 https://github.com/rime/weasel third_party/src/weasel
          cd third_party/src/weasel
          git fetch --depth 1 origin d73f6295e8252ed2f7b9c12bae32e9001b1afdaa
          git checkout d73f6295e8252ed2f7b9c12bae32e9001b1afdaa
          git apply --whitespace=nowarn ../../../patches/weasel-0.17.4-heng-m1.patch
          Copy-Item ../../../patches/env.bat .

      - name: 安装 boost 1.84
        shell: pwsh
        run: |
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw "runner 上找不到 7z.exe" }
          Invoke-WebRequest -Uri "https://archives.boost.io/release/1.84.0/source/boost_1_84_0.7z" -OutFile boost.7z
          & $sevenZip x boost.7z "-othird_party/src/weasel/deps" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "boost 解压失败，退出码 $LASTEXITCODE" }
          if (-not (Test-Path third_party/src/weasel/deps/boost_1_84_0/boost/version.hpp)) {
            throw "boost 解压后未见 version.hpp"
          }

      - name: 生成 weasel.props
        shell: pwsh
        run: |
          # weasel.props 被上游 .gitignore 忽略，补丁里没有它，
          # 而入库的模板里 BOOST_ROOT 是本机绝对路径 —— CI 必须按实际路径重写。
          $ErrorActionPreference = 'Stop'
          $boost = (Resolve-Path third_party/src/weasel/deps/boost_1_84_0).Path
          $props = Get-Content patches/weasel.props -Raw
          $props = $props -replace '<BOOST_ROOT>[^<]*</BOOST_ROOT>', "<BOOST_ROOT>$boost</BOOST_ROOT>"
          Set-Content -Path third_party/src/weasel/weasel.props -Value $props -Encoding UTF8
          Copy-Item patches/boost-project-config.jam third_party/src/weasel/deps/boost_1_84_0/project-config.jam -Force
          if (-not (Select-String -Path third_party/src/weasel/weasel.props -Pattern ([regex]::Escape($boost)) -Quiet)) {
            throw "BOOST_ROOT 未写入 weasel.props"
          }

      - name: 铺共享数据
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path third_party/externals | Out-Null
          # WinSparkle：官方 weasel installer 里的是 32 位，x64 必须从上游 release 自取。
          # 资产是按平台分的 zip，解压后在 x64/ 子目录里。
          Invoke-WebRequest -Uri "https://github.com/vslavik/winsparkle/releases/download/v0.9.4/WinSparkle-0.9.4.zip" -OutFile wsp.zip
          Expand-Archive wsp.zip -DestinationPath wsp -Force
          $x64 = Get-ChildItem wsp -Recurse -Filter WinSparkle.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $x64) { throw "WinSparkle x64 版未找到，请核对 release 目录结构" }
          Copy-Item $x64.FullName third_party/externals/WinSparkle.dll -Force
          # 雾凇词库。latest release 的 tag 是 nightly，资产按语言分包；
          # 解压后顶层即 cn_dicts/，正是 sync-deps.bat 的存在性判据。
          Invoke-WebRequest -Uri "https://github.com/iDvel/rime-ice/releases/latest/download/cn_dicts.zip" -OutFile rime.zip
          Expand-Archive rime.zip -DestinationPath third_party/externals/data -Force
          if (-not (Test-Path third_party/externals/data/cn_dicts)) {
            throw "词库解压后未见 cn_dicts，资产结构与预期不符"
          }

      - name: 叠加本项目配置
        shell: pwsh
        run: |
          # 雾凇原版之外有四个文件是本项目自己的，在主仓库留底。
          # 少了它们编译仍能过，但行为与本地不一致（配色方案 / 左右键切换候选）。
          $ErrorActionPreference = 'Stop'
          $data = "third_party/externals/data"
          Copy-Item patches/rime-default.yaml   "$data/default.yaml" -Force
          Copy-Item patches/rime-weasel.yaml    "$data/weasel.yaml" -Force
          Copy-Item patches/rime-ice.schema.yaml "$data/rime_ice.schema.yaml" -Force
          Copy-Item config-center/shared/heng.yaml "$data/heng.yaml" -Force

      - name: 编译 core
        run: cargo build --release -p heng-core

      - name: 重建 heng.lib 导入库
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # core 每新增导出后 lib64/heng.lib 不会自动更新，链接期报 LNK2001。
          # 从新 dll 的导出表生成 .def 再 lib /def。这一步必须在 core 与 msbuild 之间。
          $dll = (Resolve-Path target/release/heng_core.dll).Path
          $libDir = "third_party/src/weasel/lib64"
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null

          # 读 PE 导出表。不依赖仓库内的工具脚本 —— .workbuddy/ 是 gitignored 的，
          # CI 上不存在。导出名在 PE 里是 ASCII，长度前缀后跟名字，以 NUL 结尾。
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          $magic = [BitConverter]::ToUInt16($bytes, $peOff + 24)
          $nSections = [BitConverter]::ToUInt16($bytes, $peOff + 6)
          $optSize = [BitConverter]::ToUInt16($bytes, $peOff + 20)
          $secOff = $peOff + 24 + $optSize
          # DataDirectory[0] = Export Table。
          # 可选头从 peOff+24 开始，数据目录在可选头内的偏移是 112(PE32+)/96(PE32)，
          # 所以绝对偏移是 peOff+24+112 —— 少加这 24 字节会读到某个节的 Size 字段，
          # 值看着像RVA（0x100000），后续按节映射得到垃圾偏移而不报错。
          $dirOff = if ($magic -eq 0x20B) { $peOff + 24 + 112 } else { $peOff + 24 + 96 }
          $expRva = [BitConverter]::ToUInt32($bytes, $dirOff)
          if ($expRva -eq 0) { throw "dll 无导出表" }

          $raw = $null
          for ($i = 0; $i -lt $nSections; $i++) {
            $s = $secOff + $i * 40
            $va = [BitConverter]::ToUInt32($bytes, $s + 12)
            $vs = [BitConverter]::ToUInt32($bytes, $s + 8)
            $ptr = [BitConverter]::ToUInt32($bytes, $s + 20)
            if ($expRva -ge $va -and $expRva -lt ($va + [Math]::Max($vs, 1))) {
              $raw = $ptr + ($expRva - $va)
              break
            }
          }
          if ($null -eq $raw) { throw "未定位到导出表所在节" }

          $nNames = [BitConverter]::ToUInt32($bytes, $raw + 24)
          $namesRva = [BitConverter]::ToUInt32($bytes, $raw + 32)
          $namesOff = $null
          for ($i = 0; $i -lt $nSections; $i++) {
            $s = $secOff + $i * 40
            $va = [BitConverter]::ToUInt32($bytes, $s + 12)
            $vs = [BitConverter]::ToUInt32($bytes, $s + 8)
            $ptr = [BitConverter]::ToUInt32($bytes, $s + 20)
            if ($namesRva -ge $va -and $namesRva -lt ($va + [Math]::Max($vs, 1))) {
              $namesOff = $ptr + ($namesRva - $va)
              break
            }
          }
          if ($null -eq $namesOff) { throw "未定位到导出名表" }

          $names = @()
          for ($i = 0; $i -lt $nNames; $i++) {
            $rva = [BitConverter]::ToUInt32($bytes, $namesOff + $i * 4)
            $fo = $null
            for ($j = 0; $j -lt $nSections; $j++) {
              $s2 = $secOff + $j * 40
              $va2 = [BitConverter]::ToUInt32($bytes, $s2 + 12)
              $vs2 = [BitConverter]::ToUInt32($bytes, $s2 + 8)
              $ptr2 = [BitConverter]::ToUInt32($bytes, $s2 + 20)
              if ($rva -ge $va2 -and $rva -lt ($va2 + [Math]::Max($vs2, 1))) {
                $fo = $ptr2 + ($rva - $va2)
                break
              }
            }
            if ($null -eq $fo) { continue }
            $end = $fo
            while ($bytes[$end] -ne 0) { $end++ }
            $names += [System.Text.Encoding]::ASCII.GetString($bytes, $fo, $end - $fo)
          }
          if ($names.Count -eq 0) { throw "导出名表为空" }

          # 排序规则与 sync_heng_def.py 一致：非 heng_ 前缀按原样（Slint 的 *VTable
          # 等大写符号自然排在 heng_ 之后），heng_* 按字典序。
          # 用 CompareOrdinal 而非 Sort-Object：后者走区域性比较且不区分大小写，
          # 生成的顺序与入库的 patches/heng.df 不同（ClipVTable 会排到 CheckBoxVTable 之后）。
          # 顺序对 lib.exe 无影响，但一致才能直接 diff 出「dll 多了哪个导出」。
          $list = [System.Collections.Generic.List[string]]::new()
          $list.AddRange([string[]]$names)
          $cmp = [System.Comparison[string]]{
            param($a, $b)
            $ka = if ($a.StartsWith('heng_')) { $a.ToLowerInvariant() } else { $a }
            $kb = if ($b.StartsWith('heng_')) { $b.ToLowerInvariant() } else { $b }
            [string]::CompareOrdinal($ka, $kb)
          }
          $list.Sort($cmp)
          $def = @("LIBRARY heng_core", "EXPORTS") + ($list | ForEach-Object { "    $_" })
          [System.IO.File]::WriteAllLines("$libDir/heng.def", $def)
          Write-Host "导出符号 $($names.Count) 项"

          # runner 上的 VS 装在哪个 edition 目录不固定（Enterprise / Community /
          # BuildTools 都可能），且 ProgramFiles 与 ProgramW6432 在 pwsh 里取值不稳。
          # 逐个候选路径找，找到即用；都找不到就把搜过的路径写进摘要。
          $candidates = @(
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
            "${env:ProgramW6432}\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          )
          $vcvars = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          {
            echo "### vcvars 候选"
            echo '```'
            $candidates | ForEach-Object { "$_ => $(Test-Path $_)" }
            echo "选中: $vcvars"
            echo '```'
          } | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if (-not $vcvars) { throw "找不到 vcvars64.bat" }
          & cmd /c "call `"$vcvars`" >nul && cd /d `"$libDir`" && lib /def:heng.def /machine:X64 /out:heng.lib 2>&1"
          if ($LASTEXITCODE -ne 0) { throw "lib.exe 失败，退出码 $LASTEXITCODE" }
          if (-not (Test-Path "$libDir/heng.lib")) { throw "heng.lib 未生成" }

      - name: 编译 weasel
        shell: cmd
        run: |
          cd third_party\src\weasel
          rem build-x64.bat 里有三处 pause，靠重定向 stdin 让它立即返回而不是等输入。
          rem 它自己把 msbuild 输出写进 msbuild-x64.log，失败时把该文件送进 job 摘要——
          rem 拉取 CI 日志需要仓库 admin 权限，外部只看得到 step 失败。
          build-x64.bat < NUL
          if errorlevel 1 (
            echo ### build-x64.bat failed>> %GITHUB_STEP_SUMMARY%
            type msbuild-x64.log >> %GITHUB_STEP_SUMMARY%
            exit /b 1
          )

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: heng-windows
          path: |
            third_party/src/weasel/output/WeaselServer.exe
            third_party/src/weasel/output/WeaselDeployer.exe
            third_party/src/weasel/output/weaselx64.dll
            third_party/src/weasel/output/heng_core.dll
            third_party/src/weasel/output/rime.dll
            third_party/src/weasel/output/WinSparkle.dll

  # Linux 外壳：自研 fcitx5 addon，源码已入库，无需补丁重放。
  shell-linux:
    name: 外壳 Linux (fcitx5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config librime-dev libfontconfig1-dev \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 编译 core
        run: cargo build --release -p heng-core

      - name: 编译 addon
        run: |
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release shells/linux/fcitx5
          cmake --build build 2>&1 | tee cmake.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "### cmake --build 失败，末尾 40 行" >> "$GITHUB_STEP_SUMMARY"
            tail -40 cmake.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 校验产物
        run: |
          set -euo pipefail
           test -f build/libheng.so || { echo "addon 未产出"; exit 1; }
           # addon 通过 C ABI 调 core，链接期没报错即说明符号解析成功；
           # 这里再确认它确实指向 core 导出的入口
           nm -D build/libheng.so | grep -q heng_create \
             || { echo "addon 未引用 heng_create"; exit 1; }
           ldd build/libheng.so | grep -q "not found" \
             && { echo "有未解析的动态库依赖"; exit 1; } || true

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: heng-linux
          path: |
            build/libheng.so
            target/release/libheng_core.so

  # macOS 外壳：squirrel 改造。改动固化在 patches/squirrel-heng.patch。
  shell-macos:
    name: 外壳 macOS (squirrel)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 librime
        run: |
          curl -fL --retry 3 -o rime.tar.bz2 \
            "https://github.com/rime/librime/releases/download/1.17.0/rime-33e7814-macOS-universal.tar.bz2"
          mkdir -p third_party/librime
          if ! tar xjf rime.tar.bz2 -C third_party/librime; then
            echo "tar xjf 失败，改用 python3"
            python3 -c "import tarfile; tarfile.open('rime.tar.bz2').extractall('third_party/librime')"
          fi
          LIB=third_party/librime/dist/lib
          REAL=$(cd "$LIB" && ls librime.1.*.dylib | head -1)
          # squirrel 的 Makefile 要 lib/librime.1.dylib，core/build.rs 要 librime.dylib
          [ -e "$LIB/librime.1.dylib" ] || ln -s "$REAL" "$LIB/librime.1.dylib"
          [ -e "$LIB/librime.dylib" ] || ln -s librime.1.dylib "$LIB/librime.dylib"
          test -f "$LIB/librime.dylib"

      - name: 克隆 squirrel 并重放补丁
        run: |
          set -euo pipefail
          # 基线是品牌图标定型 commit 6ad0e45b（作者为本项目），含 logo.svg
          git clone --depth 1 https://github.com/rime/squirrel third_party/src/squirrel
          cd third_party/src/squirrel
          git fetch --depth 1 origin 6ad0e45bcf53b770474100c02cec43912f0da502
          git checkout 6ad0e45bcf53b770474100c02cec43912f0da502
          git apply ../../../patches/squirrel-heng.patch
          # 只拉 Sparkle 与 plum。librime 那个 submodule 不初始化——
          # 编译用的是仓库 third_party/librime 下的官方预编译包，
          # 拉源码既慢又与core/build.rs 找的位置冲突。
          git submodule update --init --recursive Sparkle plum

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 编译 core
        run: cargo build --release -p heng-core

      - name: 同步 core 产物到 squirrel
        run: |
          # librime 解压在仓库的 third_party/librime（core/build.rs 从这里找），
          # squirrel 树内那个 librime/ 是它自己的 submodule 位置，两者不是同一份。
          #
          # 每个 run 步骤都从工作区根目录起算，之前的 cd 不跨步骤保留，
          # 所以这里必须用 $GITHUB_WORKSPACE 定位，不能写 ../../../。
          LR="$GITHUB_WORKSPACE/third_party/librime/dist"
          {
            echo "### librime dist: $LR"
            ls -l "$LR/lib" "$LR/bin"
          } >> "$GITHUB_STEP_SUMMARY" 2>&1
          cd third_party/src/squirrel
          mkdir -p lib librime/include bin
          # Makefile 的 DEPS_CHECK 要 lib/librime.1.dylib
          cp -L "$LR/lib/librime.1.dylib" lib/
          # BSD cp（macOS 自带）没有 -pR 参数，用 cp -R 兼容两边
          cp -R "$LR/lib/rime-plugins" lib/
          cp "$LR/bin/rime_deployer" bin/
          cp "$LR/bin/rime_dict_manager" bin/
          xcrun install_name_tool -add_rpath @loader_path/../Frameworks bin/rime_deployer
          xcrun install_name_tool -add_rpath @loader_path/../Frameworks bin/rime_dict_manager
          # 贴帧层经 bridging header 调这些符号，dylib 与头文件都要同步
          cp "$GITHUB_WORKSPACE/target/release/libheng_core.dylib" lib/
          cp "$GITHUB_WORKSPACE/core/include/heng.h" librime/include/heng.h
          ls -l lib/ librime/include/heng.h

      - name: 准备 plum 数据与 Sparkle
        run: |
          set -euo pipefail
          cd third_party/src/squirrel
          make copy-plum-data || make plum-data
          make opencc-data
          # Sparkle.framework 是 DEPS_CHECK 的一项
          make copy-sparkle-framework

      - name: 编译 Squirrel
        run: |
          set -o pipefail
          cd third_party/src/squirrel
          mkdir -p build
          # xcbeautify 不在 runner 上预装，直接用原始 xcodebuild 输出
          xcodebuild -project Squirrel.xcodeproj \
            -configuration Debug -scheme Squirrel \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | tee xcodebuild.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "### xcodebuild 失败，末尾 60 行" >> "$GITHUB_STEP_SUMMARY"
            tail -60 xcodebuild.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 收集产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heng-macos
          path: third_party/src/squirrel/build/Build/Products/Debug/Squirrel.app