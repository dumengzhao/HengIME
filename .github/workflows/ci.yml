name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 拉取 Actions 运行日志需要仓库 admin 权限，外部只能看到每个步骤的成败。
# 步骤失败时把日志尾部写进 $GITHUB_STEP_SUMMARY（UI 上可见），
# 同时整个工作区的 *.log 作为一个 artifact 上传——artifact 走公开 API，
# 不需要 admin，是外部唯一能拿到失败细节的途径。
#
# 注意：$GITHUB_STEP_SUMMARY 的内容不会出现在 check-run 的 output.summary 字段里
#（那个字段对应 Actions toolkit 的 core.summary，是另一套机制），别指望从 API 读它。

# librime 的下载地址在各步骤里写死：1.17.0 release，源码点 33e7814。
# 写成变量曾导致三个平台的安装步骤一起失败，而拉取 CI 日志需要仓库 admin
# 权限、看不到变量展开后的实际值，不如直接内联。
# 对应关系见 third_party/librime/version-info.txt。

jobs:
  # 三平台共用：编 core、跑单测、过 ABI 全链路。
  # 各job 唯一的差别是「librime 从哪来」——core 的 build.rs 按 target_os 分三条路：
  #   Windows/macOS 强制要求 third_party/librime/dist/lib 里有官方预编译产物；
  #   Linux 有本地产物就用，没有则链发行版包 librime-dev。
  core:
    name: core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Windows runner 上 run 的默认 shell 是 pwsh，而这个 job 的步骤统一用 bash 语法
    # （set -o pipefail / PIPESTATUS / { } >> $GITHUB_STEP_SUMMARY）。
    # 不显式声明的话，Windows 会把 `set -o pipefail` 当成 PowerShell 命令而报错。
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
          - name: Windows
            os: windows-2022
            rust-target: x86_64-pc-windows-msvc
          - name: macOS
            os: macos-15
            rust-target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: 安装 librime（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 7-Zip 预装在 windows-2022 上但不在 PATH 里，必须用完整路径。
          # 内置的 tar.exe 不支持 7z 的 LZMA 编码，替代不了。
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw "runner 上找不到 7z.exe" }
          $url = 'https://github.com/rime/librime/releases/download/1.17.0/rime-33e7814-Windows-msvc-x64.7z'
          Invoke-WebRequest -Uri $url -OutFile rime.7z
          & $sevenZip x rime.7z "-othird_party/librime" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z 解压失败，退出码 $LASTEXITCODE" }
          if (-not (Test-Path third_party/librime/dist/lib/rime.lib)) {
            throw "rime.lib 缺失，官方包结构与预期不符"
          }
          # core 链的是 rime.lib（导入库），产物 heng_core.dll 与单测 exe 运行时
          # 仍要加载 rime.dll。测试 exe 落在 target/release/deps/，那里没有 rime.dll，
          # 只能在 PATH 里补一份，否则 cargo test 报「找不到依赖」。
          "$env:GITHUB_WORKSPACE\third_party\librime\dist\lib" | Out-File -Append $env:GITHUB_PATH

      - name: 安装 librime（macOS）
        if: runner.os == 'macOS'
        run: |
          curl -fL --retry 3 -o rime.tar.bz2 \
            "https://github.com/rime/librime/releases/download/1.17.0/rime-33e7814-macOS-universal.tar.bz2"
          mkdir -p third_party/librime
          # 不用 set -e：出错时要自己给消息。bzip2 支持在 runner 上是有的，
          # 但留python3 兜底以防镜像差异。
          if ! tar xjf rime.tar.bz2 -C third_party/librime; then
            echo "tar xjf 失败，改用 python3"
            python3 -c "import tarfile; tarfile.open('rime.tar.bz2').extractall('third_party/librime')"
          fi
          LIB=third_party/librime/dist/lib
          ls -l "$LIB"
          # 包里 librime.dylib 与 librime.1.dylib 是指向 librime.<版本>.dylib 的符号链接。
          # core/build.rs 检查 librime.dylib，缺符号链接时 cargo build 直接 panic。
          REAL=$(cd "$LIB" && ls librime.1.*.dylib | head -1)
          echo "实体库: $REAL"
          [ -e "$LIB/librime.1.dylib" ] || ln -s "$REAL" "$LIB/librime.1.dylib"
          [ -e "$LIB/librime.dylib" ] || ln -s librime.1.dylib "$LIB/librime.dylib"
          test -f "$LIB/librime.dylib"
          # 官方包的 dylib install_name 不是 @rpath，测试二进制与 heng-cli 运行时
          # 找不到它就会 dyld 报错。写进 GITHUB_ENV 让后续步骤都带上。
          echo "DYLD_LIBRARY_PATH=$GITHUB_WORKSPACE/third_party/librime/dist/lib:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$GITHUB_WORKSPACE/third_party/librime/dist/lib" >> "$GITHUB_ENV"

      - name: 安装 librime（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # librime-dev 提供 librime.so 与头文件；
          # libfontconfig1-dev 是 yeslogic-fontconfig-sys 的构建期依赖，
          # 由 slint 的 software-renderer-systemfonts feature 引入，缺它 cargo build 会失败。
          # x11rb 是纯 Rust，不需要额外的 X11 开发包。
          sudo apt-get install -y librime-dev cmake pkg-config libfontconfig1-dev

      - name: 安装 Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        # librime 的官方 Windows 产物是 MSVC 的 rime.lib。windows-2022 runner 的
        # 默认 host 就是 msvc，这里把三个平台的 host 显式写进 job 摘要——
        # 失败时能确认工具链是不是预期的那个（targets 参数只装额外 target，
        # 不切host）。
        with:
          targets: ${{ matrix.rust-target }}

      - name: 记录工具链
        run: |
          {
            echo "### host 与target"
            echo '```'
            rustc -vV
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 编译 core
        run: |
          set -o pipefail
          # 工具链写进 job 摘要：MSVC 与 GNU 工具链在链接 librime 时行为不同，
          # 失败时需要知道 runner 用的是哪个。librime 的官方 Windows 产物是
          # MSVC 的 rime.lib，用 GNU 工具链会链接失败。
          {
            echo "### toolchain"
            echo '```'
            rustc -vV
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo build --release -p heng-core 2>&1 | tee build.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            {
              echo "### cargo build 失败，末尾 60 行"
              echo '```'
              tail -60 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 再打一遍到 stdout：job 摘要只能从 UI 看，
            # 而拉取 CI 日志需要仓库 admin 权限
            echo "::error::cargo build 失败，详见 job summary 与末尾 60 行"
            exit 1
          fi

      - name: 单测
        run: |
          set -o pipefail
          # core/src/ui.rs 里 5 个测试涉UI 后端。macOS runner 是无头环境，
          # 没有窗口系统可用，失败时需要看到具体是哪个断言。
          cargo test --release -p heng-core --lib 2>&1 | tee test.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            {
              echo "### cargo test 失败，末尾 60 行"
              echo '```'
              tail -60 test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "^(test |failures:|---- )" test.log | head -40 || true
            exit 1
          fi

      - name: 铺运行时配置
        run: |
          # runtime/ 被 gitignore，CI 上不存在，而 abitest 的断言要读配置与词库。
          # 用 HENG_RUNTIME 指向现铺的目录。三个平台都要铺——ABI 全链路那步
          # 不按平台跳过，缺目录时 librime 部署直接 failure。
          #
          # 雾凇的部分（词典、lua 模块、符号表、opencc、7 个双拼 schema）不在仓库里，
          # 也不该入库 —— 它们跟着上游走，直接取 full.zip。入库会与上游脱节，
          # 而且那批文件里没有任何本项目的改动（实测与本机逐文件 md5 相同）。
          # 词典是持续更新的（上游一个月至少两次增改词汇与权重），锁版本反而是错的。
          #
          # 这步原来没有日志，Windows 上失败时看不到是哪一条断言不成立。
          # 失败时把目录清单和 default.yaml 的实际内容送进 artifact。
          set -o pipefail
          mkdir -p ci-runtime/rime-shared ci-runtime/rime-user
          curl -fL --retry 3 -o rime-full.zip \
            "https://github.com/iDvel/rime-ice/releases/latest/download/full.zip"
          # 解压不能依赖 python：Windows Git Bash 里的 `python` 可能是
          # Microsoft Store 的占位符（存在但执行即失败），而 runner 上没有 unzip。
          # pwsh 的 Expand-Archive 是 Windows 上唯一稳的路径。
          if command -v unzip >/dev/null 2>&1; then
            unzip -q rime-full.zip -d ci-runtime/rime-shared
          else
            powershell -NoProfile -Command "Expand-Archive -Path rime-full.zip -DestinationPath ci-runtime/rime-shared -Force"
          fi
          test -f ci-runtime/rime-shared/default.yaml || {
            echo "解压失败：没有 default.yaml"; ls -la rime-full.zip; exit 1; }

          # 本项目改过的三个配置覆盖在雾凇原版之上。
          # schema_list 只留 rime_ice：其余 8 个方案（t9 + 7 个双拼）本机在用但
          # 未入库，librime 遇到缺失的 schema 会让整个部署以 failure 收场。
          # 用 shell 版而不是 python 版：Windows Git Bash 里的 `python` 可能是
          # Microsoft Store 的占位符，且 python 版在 Windows 上会把这个 CRLF 文件
          # 的行尾改掉。shell 版内容与 python 版等价（已用真实 full.zip 比对）。
          bash tools/ci/make_ci_default.sh \
            ci-runtime/rime-shared/default.yaml \
            ci-runtime/rime-shared/default.yaml
          cp patches/rime-ice.schema.yaml    ci-runtime/rime-shared/rime_ice.schema.yaml
          cp patches/rime-weasel.yaml        ci-runtime/rime-shared/weasel.yaml
          cp config-center/shared/heng.yaml  ci-runtime/rime-shared/heng.yaml

          {
            echo "### rime-shared 内容"
            ls ci-runtime/rime-shared/
            echo "### cn_dicts 前10 项"
            ls ci-runtime/rime-shared/cn_dicts/ | head -10
            echo "### default.yaml 的 schema_list"
            grep -n -A14 'schema_list' ci-runtime/rime-shared/default.yaml
          } > runtime-setup.log 2>&1
          cat runtime-setup.log

          # 断言逐条给消息，不让 test -f 静默退出。
          for d in lua cn_dicts opencc; do
            [ -d "ci-runtime/rime-shared/$d" ] || { echo "缺目录 $d"; exit 1; }
          done
          for f in rime_ice.dict.yaml rime_ice.schema.yaml default.yaml weasel.yaml heng.yaml; do
            [ -f "ci-runtime/rime-shared/$f" ] || { echo "缺文件 $f"; exit 1; }
          done
          # 不能用 grep -c：计数为 0 时它 exit 1，在 pipefail 下会把整步带崩，
          # 而「一条都没留」与「文件读不出来」需要不同的消息。
          grep -v '^#' ci-runtime/rime-shared/default.yaml | grep 'schema: rime_ice' \
            || { echo "default.yaml 里没有未注释的 schema: rime_ice"; exit 1; }

      - name: ABI 全链路
        env:
          HENG_RUNTIME: ${{ github.workspace }}/ci-runtime
        run: |
          set -o pipefail
          {
            echo "### 运行时目录"
            ls -R "$HENG_RUNTIME" | head -40
          } > abitest-setup.log 2>&1
          cat abitest-setup.log
          cargo run --release -p heng-cli -- abitest 2>&1 | tee abitest.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            {
              echo "### abitest 失败，末尾 60 行"
              echo '```'
              tail -60 abitest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 编译 heng-cli
        run: cargo build --release -p heng-cli

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-core-${{ matrix.name }}
          path: "*.log"
          if-no-files-found: ignore

  # Windows 外壳：weasel改造。链条最长——补丁重放 + boost + MSBuild + 导入库重建。
  shell-windows:
    name: 外壳 Windows (weasel)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: 安装 librime
        shell: pwsh
        run: |
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw "runner 上找不到 7z.exe" }
          Invoke-WebRequest -Uri 'https://github.com/rime/librime/releases/download/1.17.0/rime-33e7814-Windows-msvc-x64.7z' -OutFile rime.7z
          & $sevenZip x rime.7z "-othird_party/librime" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z 解压失败，退出码 $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path third_party/externals | Out-Null
          Copy-Item third_party/librime/dist/lib/rime.dll third_party/externals/ -Force

      - name: 克隆 weasel 并重放补丁
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 基线是托盘刷新修复 commit d73f629，在 tag 0.17.4 之后。用tag 会 context 对不上。
          git clone --depth 1 https://github.com/rime/weasel third_party/src/weasel
          cd third_party/src/weasel
          git fetch --depth 1 origin d73f6295e8252ed2f7b9c12bae32e9001b1afdaa
          git checkout d73f6295e8252ed2f7b9c12bae32e9001b1afdaa
          git apply --whitespace=nowarn ../../../patches/weasel-0.17.4-heng-m1.patch
          Copy-Item ../../../patches/env.bat .

      - name: 安装 boost 1.84
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 解压 boost 1.84
        shell: pwsh
        run: |
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw "runner 上找不到 7z.exe" }
          Invoke-WebRequest -Uri "https://archives.boost.io/release/1.84.0/source/boost_1_84_0.7z" -OutFile boost.7z
          & $sevenZip x boost.7z "-othird_party/src/weasel/deps" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "boost 解压失败，退出码 $LASTEXITCODE" }
          if (-not (Test-Path third_party/src/weasel/deps/boost_1_84_0/boost/version.hpp)) {
            throw "boost 解压后未见 version.hpp"
          }

      - name: bootstrap b2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 官方 7z 源码包只含 bootstrap.bat，不含 b2.exe（7z l 里只有
          # bootstrap.bat / bootstrap.sh / tools\build\bootstrap.bat），
          # b2 要自己编。weasel 自带的 build.bat 走的就是
          # `if not exist b2.exe call bootstrap.bat`。
          #
          # 少了这一步的后果不是「b2 报找不到」而是整个步骤静默结束：
          # pwsh 调用不存在的可执行文件抛 CommandNotFoundException，
          # 而 $ErrorActionPreference=Stop 让它当场终止，b2 输出全空，
          # 看起来像 b2 自己没说话。
          $root = "third_party/src/weasel/deps/boost_1_84_0"
          $log = "$env:GITHUB_WORKSPACE\boost-bootstrap.log"
          function Log($m) { $m | Tee-Object -FilePath $log -Append }

          Log "cl.exe 在 PATH => $([bool](Get-Command cl.exe -ErrorAction SilentlyContinue))"
          Push-Location $root
          # bootstrap.bat 是 cmd 脚本，pwsh 直接调用会另起一个 cmd.exe 跑它。
          $out = & ".\bootstrap.bat" 2>&1
          $rc = $LASTEXITCODE
          Pop-Location
          $out | Out-File -FilePath "$env:GITHUB_WORKSPACE\b2-bootstrap-out.log" -Encoding utf8
          Log "bootstrap 退出码 $rc"
          $out | Select-Object -Last 40 | ForEach-Object { Log "$_" }
          if ($rc -ne 0) { throw "bootstrap.bat 失败，退出码 $rc" }
          if (-not (Test-Path "$root\b2.exe")) { throw "bootstrap 后未见 b2.exe" }
          Log ("b2.exe 大小 = {0}" -f (Get-Item "$root\b2.exe").Length)

      - name: 编译 boost 静态库
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # b2 的输出可能很长，全部落盘：artifact 上传是外部唯一能读到它的途径。
          $log = "$env:GITHUB_WORKSPACE\boost-build.log"
          function Log($m) { $m | Tee-Object -FilePath $log -Append }

          # 入库的 boost-project-config.jam 带的是本机绝对路径（BuildTools
          # 14.44），runner 上是 Enterprise，编译器与 <setup> 两处都得重写。
          #
          # <setup> 不能省。msvc.jam 的 set-setup-command 靠它生成
          # bin.v2\standalone\msvc\msvc-14.3\msvc-setup.bat 与同名 .nup，
          # 后者是所有 .obj 的前置依赖。省掉它之后 b2 把每个 .obj 都报成
          # "skipped for lack of msvc-setup.nup"，全程不提 setup 这个词，
          # 也不提缺了任何东西——只有 1024 targets 里 105 个在动、
          # 组件配置表写着 serialization: building 却没有一个 .obj 编出来
          # 这两点对得上。
          # msvc-dev-cmd 注入的是本步骤的环境，不影响 b2 自己的 action 脚本。
          $root = "third_party/src/weasel/deps/boost_1_84_0"
          $cl = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64\cl.exe"
          $lib = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64\lib.exe"
          # vcvars 在 VC\Auxiliary\Build\ 下。VCToolsInstallDir 形如
          # ...\VC\Tools\MSVC\<ver>\，往上三级（14.44.35207 -> MSVC -> Tools -> VC）
          # 到 VC\。用 [System.IO.Directory]::GetParent 而不是 Split-Path -Parent：
          # 后者在嵌套调用里参数解析不可靠，实测会把 Tools 拼成 ToolsX。
          $vcDir = $env:VCToolsInstallDir
          for ($i = 0; $i -lt 3; $i++) {
            $vcDir = [System.IO.Directory]::GetParent($vcDir.TrimEnd('\')).FullName
          }
          $setup = @(
            (Join-Path $vcDir "Auxiliary\Build\vcvars64.bat")
            (Join-Path $vcDir "Auxiliary\Build\vcvarsall.bat")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          Log "VCToolsInstallDir = $env:VCToolsInstallDir"
          Log "cl.exe  = $cl => $(Test-Path $cl)"
          Log "lib.exe = $lib => $(Test-Path $lib)"
          Log "setup   = $setup => $([bool]$setup)"
          if (-not (Test-Path $cl)) { throw "找不到 cl.exe" }
          if (-not $setup) {
            Get-ChildItem (Join-Path $vcDir "Auxiliary\Build") -Filter "*.bat" |
              ForEach-Object { Log "  " + $_.FullName }
            throw "找不到 vcvars64/vcvarsall"
          }
          @"
          import option ;
          using msvc : 14.3 : "$($cl -replace '\\','/')" : <setup>"$($setup -replace '\\','/')" <archiver>"$($lib -replace '\\','/')" ;
          option.set keep-going : false ;
          "@ | Set-Content -Path "$root/project-config.jam" -Encoding ASCII

          # 官方 7z 包只有 boost 源码，没有编好的 .lib，而 weasel 要链
          # boost::thread / boost::serialization / boost::chrono
          # （include/PipeChannel.h 与 WeaselIPCData.h 用了 boost::thread、
          # boost::interprocess、boost::serialization）。
          #
          # --with-serialization 只带出 serialization 与 wserialization，
          # thread / chrono 必须显式列出——本机 bin.v2/libs 下就是
          # chrono / serialization / thread / wserialization 这四个目录。
          # 不加 --with-iostreams：它要 zlib / bzip2，源码包里没有。
          $nproc = [int]$env:NUMBER_OF_PROCESSORS
          if ($nproc -le 0) { $nproc = 2 }
          $b2args = @(
            "-j$nproc",
            "architecture=x86", "address-model=64",
            "toolset=msvc-14.3",
            "define=BOOST_USE_WINAPI_VERSION=0x0603",
            "link=static", "runtime-link=static",
            "--with-serialization", "--with-thread",
            "--build-type=complete",
            "stage"
          )
          #
          # 输出先进变量再落盘：b2 编译 boost 要几分钟，输出上千行，
          # 经管道再重定向在 pwsh 里会丢内容。b2.exe 是控制台程序，
          # 用调用运算符直接跑，$LASTEXITCODE 就是它自己的退出码。
          Log "b2.exe => $(Test-Path "$root\b2.exe")"
          Log "--- b2 开始 ---"
          Push-Location $root
          $all = & ".\b2.exe" @b2args 2>&1
          $rc = $LASTEXITCODE
          Pop-Location
          $all | Out-File -FilePath "$env:GITHUB_WORKSPACE\b2-out.log" -Encoding utf8
          Log "--- b2 退出码 $rc ---"
          Log "--- b2 输出（末尾 80 行）---"
          if ($all) {
            $all | Select-Object -Last 80 | ForEach-Object { Log "$_" }
          } else {
            Log "b2 无任何输出"
          }
          if ($rc -ne 0) { throw "b2 失败，退出码 $rc" }
          # 按名字核对而不是数个数：只编 --with-serialization 时同样是 4 个 .lib
          # （serialization / wserialization 各两套 CRT 变体），
          # 但缺的正是 WeaselTSF 要链的 libboost_thread。
          $libs = @(Get-ChildItem "$root/stage/lib" -Filter "*.lib")
          Log "产出 lib 数 = $($libs.Count)"
          $libs | ForEach-Object { Log $_.Name }
          # msbuild 的 Release|x64 是动态 CRT，要 mt-s- 那一套
          $need = @(
            "libboost_thread-vc143-mt-s-x64-1_84.lib",
            "libboost_chrono-vc143-mt-s-x64-1_84.lib",
            "libboost_serialization-vc143-mt-s-x64-1_84.lib",
            "libboost_wserialization-vc143-mt-s-x64-1_84.lib"
          )
          $names = @($libs | ForEach-Object { $_.Name })
          $missing = @($need | Where-Object { $names -notcontains $_ })
          if ($missing.Count -gt 0) {
            throw "boost 缺以下库（链接期会 LNK1104）：$($missing -join ', ')"
          }

      - name: 生成 weasel.props
        shell: pwsh
        run: |
          # weasel.props 被上游 .gitignore 忽略，补丁里没有它，
          # 而入库的模板里 BOOST_ROOT 是本机绝对路径 —— CI 必须按实际路径重写。
          $ErrorActionPreference = 'Stop'
          $boost = (Resolve-Path third_party/src/weasel/deps/boost_1_84_0).Path
          $props = Get-Content patches/weasel.props -Raw
          $props = $props -replace '<BOOST_ROOT>[^<]*</BOOST_ROOT>', "<BOOST_ROOT>$boost</BOOST_ROOT>"
          Set-Content -Path third_party/src/weasel/weasel.props -Value $props -Encoding UTF8
          if (-not (Select-String -Path third_party/src/weasel/weasel.props -Pattern ([regex]::Escape($boost)) -Quiet)) {
            throw "BOOST_ROOT 未写入 weasel.props"
          }

      - name: 铺共享数据
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path third_party/externals | Out-Null
          # WinSparkle：官方 weasel installer 里的是 32 位，x64 必须从上游 release 自取。
          # 资产是按平台分的 zip，解压后在 x64/ 子目录里。
          Invoke-WebRequest -Uri "https://github.com/vslavik/winsparkle/releases/download/v0.9.4/WinSparkle-0.9.4.zip" -OutFile wsp.zip
          Expand-Archive wsp.zip -DestinationPath wsp -Force
          $x64 = Get-ChildItem wsp -Recurse -Filter WinSparkle.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $x64) { throw "WinSparkle x64 版未找到，请核对 release 目录结构" }
          Copy-Item $x64.FullName third_party/externals/WinSparkle.dll -Force
          # 雾凇词库。latest release 的 tag 是 nightly，资产按语言分包；
          # 解压后顶层即 cn_dicts/，正是 sync-deps.bat 的存在性判据。
          Invoke-WebRequest -Uri "https://github.com/iDvel/rime-ice/releases/latest/download/cn_dicts.zip" -OutFile rime.zip
          Expand-Archive rime.zip -DestinationPath third_party/externals/data -Force
          if (-not (Test-Path third_party/externals/data/cn_dicts)) {
            throw "词库解压后未见 cn_dicts，资产结构与预期不符"
          }

      - name: 叠加本项目配置
        shell: pwsh
        run: |
          # 雾凇原版之外有四个文件是本项目自己的，在主仓库留底。
          # 少了它们编译仍能过，但行为与本地不一致（配色方案 / 左右键切换候选）。
          $ErrorActionPreference = 'Stop'
          $data = "third_party/externals/data"
          Copy-Item patches/rime-default.yaml   "$data/default.yaml" -Force
          Copy-Item patches/rime-weasel.yaml    "$data/weasel.yaml" -Force
          Copy-Item patches/rime-ice.schema.yaml "$data/rime_ice.schema.yaml" -Force
          Copy-Item config-center/shared/heng.yaml "$data/heng.yaml" -Force

      - name: 铺 librime 头文件与导入库
        shell: pwsh
        run: |
          # weasel 的 vcxproj 里写的是 $(SolutionDir)\librime\include 与
          # $(SolutionDir)\lib64（rime.lib），那是 librime submodule 的形状——
          # 而 weasel 补丁把 rime_levers_api.h 移到了 include\，
          # 导入库也从 submodule 换成了 lib64\。CI 不初始化 submodule，
          # 所以按补丁后的实际期望位置铺官方预编译产物。
          # 缺了会报 error C1083 (rime_levers_api.h) 与
          # LINK fatal error LNK1104 (rime.lib)。
          $ErrorActionPreference = 'Stop'
          $ws = "third_party/src/weasel"
          $dist = "third_party/librime/dist"
          Copy-Item "$dist/include/*" "$ws/include/" -Force
          New-Item -ItemType Directory -Force -Path "$ws/lib64" | Out-Null
          Copy-Item "$dist/lib/rime.lib" "$ws/lib64/" -Force
          if (-not (Test-Path "$ws/include/rime_levers_api.h")) { throw "rime_levers_api.h 未铺到位" }
          if (-not (Test-Path "$ws/lib64/rime.lib")) { throw "lib64/rime.lib 未铺到位" }
          Get-ChildItem "$ws/include" -Filter "rime*.h" | Select-Object -ExpandProperty Name

      - name: 编译 core
        run: cargo build --release -p heng-core

      - name: 重建 heng.lib 导入库
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # core 每新增导出后 lib64/heng.lib 不会自动更新，链接期报 LNK2001。
          # 从新 dll 的导出表生成 .def 再 lib /def。这一步必须在 core 与 msbuild 之间。
          $dll = (Resolve-Path target/release/heng_core.dll).Path
          $libDir = "third_party/src/weasel/lib64"
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          # 诊断落盘：artifact 上传是外部唯一能读到这个步骤细节的途径，
          # 只写 $GITHUB_STEP_SUMMARY 的话外部看不到。
          $diag = New-Object System.Collections.Generic.List[string]

          # 读 PE 导出表。不依赖仓库内的工具脚本 —— .workbuddy/ 是 gitignored 的，
          # CI 上不存在。导出名在 PE 里是 ASCII，长度前缀后跟名字，以 NUL 结尾。
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          $magic = [BitConverter]::ToUInt16($bytes, $peOff + 24)
          $nSections = [BitConverter]::ToUInt16($bytes, $peOff + 6)
          $optSize = [BitConverter]::ToUInt16($bytes, $peOff + 20)
          $secOff = $peOff + 24 + $optSize
          # DataDirectory[0] = Export Table。
          # 可选头从 peOff+24 开始，数据目录在可选头内的偏移是 112(PE32+)/96(PE32)，
          # 所以绝对偏移是 peOff+24+112 —— 少加这 24 字节会读到某个节的 Size 字段，
          # 值看着像RVA（0x100000），后续按节映射得到垃圾偏移而不报错。
          $dirOff = if ($magic -eq 0x20B) { $peOff + 24 + 112 } else { $peOff + 24 + 96 }
          $expRva = [BitConverter]::ToUInt32($bytes, $dirOff)
          if ($expRva -eq 0) { throw "dll 无导出表" }

          $raw = $null
          for ($i = 0; $i -lt $nSections; $i++) {
            $s = $secOff + $i * 40
            $va = [BitConverter]::ToUInt32($bytes, $s + 12)
            $vs = [BitConverter]::ToUInt32($bytes, $s + 8)
            $ptr = [BitConverter]::ToUInt32($bytes, $s + 20)
            if ($expRva -ge $va -and $expRva -lt ($va + [Math]::Max($vs, 1))) {
              $raw = $ptr + ($expRva - $va)
              break
            }
          }
          if ($null -eq $raw) { throw "未定位到导出表所在节" }

          $nNames = [BitConverter]::ToUInt32($bytes, $raw + 24)
          $namesRva = [BitConverter]::ToUInt32($bytes, $raw + 32)
          $namesOff = $null
          for ($i = 0; $i -lt $nSections; $i++) {
            $s = $secOff + $i * 40
            $va = [BitConverter]::ToUInt32($bytes, $s + 12)
            $vs = [BitConverter]::ToUInt32($bytes, $s + 8)
            $ptr = [BitConverter]::ToUInt32($bytes, $s + 20)
            if ($namesRva -ge $va -and $namesRva -lt ($va + [Math]::Max($vs, 1))) {
              $namesOff = $ptr + ($namesRva - $va)
              break
            }
          }
          if ($null -eq $namesOff) { throw "未定位到导出名表" }

          $names = @()
          for ($i = 0; $i -lt $nNames; $i++) {
            $rva = [BitConverter]::ToUInt32($bytes, $namesOff + $i * 4)
            $fo = $null
            for ($j = 0; $j -lt $nSections; $j++) {
              $s2 = $secOff + $j * 40
              $va2 = [BitConverter]::ToUInt32($bytes, $s2 + 12)
              $vs2 = [BitConverter]::ToUInt32($bytes, $s2 + 8)
              $ptr2 = [BitConverter]::ToUInt32($bytes, $s2 + 20)
              if ($rva -ge $va2 -and $rva -lt ($va2 + [Math]::Max($vs2, 1))) {
                $fo = $ptr2 + ($rva - $va2)
                break
              }
            }
            if ($null -eq $fo) { continue }
            $end = $fo
            while ($bytes[$end] -ne 0) { $end++ }
            $names += [System.Text.Encoding]::ASCII.GetString($bytes, $fo, $end - $fo)
          }
          if ($names.Count -eq 0) { throw "导出名表为空" }

          # 排序规则与 sync_heng_def.py 一致：非 heng_ 前缀按原样（Slint 的 *VTable
          # 等大写符号自然排在 heng_ 之后），heng_* 按字典序。
          # 用 CompareOrdinal 而非 Sort-Object：后者走区域性比较且不区分大小写，
          # 生成的顺序与入库的 patches/heng.df 不同（ClipVTable 会排到 CheckBoxVTable 之后）。
          # 顺序对 lib.exe 无影响，但一致才能直接 diff 出「dll 多了哪个导出」。
          $list = [System.Collections.Generic.List[string]]::new()
          $list.AddRange([string[]]$names)
          $cmp = [System.Comparison[string]]{
            param($a, $b)
            $ka = if ($a.StartsWith('heng_')) { $a.ToLowerInvariant() } else { $a }
            $kb = if ($b.StartsWith('heng_')) { $b.ToLowerInvariant() } else { $b }
            [string]::CompareOrdinal($ka, $kb)
          }
          $list.Sort($cmp)
          $def = @("LIBRARY heng_core", "EXPORTS") + ($list | ForEach-Object { "    $_" })
          [System.IO.File]::WriteAllLines("$libDir/heng.def", $def)
          Write-Host "导出符号 $($names.Count) 项"

          # runner 上的 VS 装在哪个 edition 目录不固定（Enterprise / Community /
          # BuildTools 都可能），且 ProgramFiles 与 ProgramW6432 在 pwsh 里取值不稳。
          # 逐个候选路径找，找到即用；都找不到就把搜过的路径写进摘要。
          $candidates = @(
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
            "${env:ProgramW6432}\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          )
          $vcvars = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          # 诊断同时写摘要和文件：artifact 上传是外部唯一能读到这个步骤细节的途径。
          $diag = New-Object System.Collections.Generic.List[string]
          $diag.Add("### vcvars 候选")
          $candidates | ForEach-Object { $diag.Add("$_ => $(Test-Path $_)") }
          $diag.Add("选中: $vcvars")
          $diag | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $diag | Out-File -Encoding utf8 heng-lib-diag.log
          if (-not $vcvars) { throw "找不到 vcvars64.bat" }

          # build-x64.bat 第 15 行调的是本机固定路径
          # C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\...\vcvarsall.bat，
          # runner 上不存在，脚本会在 msbuild 之前就 exit /b 1。
          # 那是本机日常构建脚本，不为 CI 改它—— 在该路径放一个转发到 runner
          # 真实环境脚本的 shim，脚本即可原样运行。
          #
          # 转发目标与 vcvars64.bat 同级（都在 VC\Auxiliary\Build\ 下），只是名字不同。
          # 实测 runner 的 Enterprise 安装里有 vcvars64.bat 而没有 vcvarsall.bat，
          # 所以按存在性挑一个能用的，不能写死名字。
          $buildDir = Split-Path $vcvars -Parent
          $fwd = @(
            (Join-Path $buildDir "vcvarsall.bat")
            (Join-Path $buildDir "vcvars64.bat")
            (Join-Path $buildDir "vsdevcmd.bat")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          $diag.Add("Build 目录: $buildDir")
          $diag.Add("转发目标: $fwd")
          if (-not $fwd) {
            $diag.Add("Build 目录内容:")
            Get-ChildItem $buildDir -Filter "*.bat" | ForEach-Object { $diag.Add("  " + $_.Name) }
            $diag | Out-File -Append heng-lib-diag.log -Encoding utf8
            throw "VC\Auxiliary\Build 下找不到 vcvarsall/vcvars64/vsdevcmd"
          }
          $shimDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build"
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
          "@echo off`r`ncall `"$fwd`" %*`r`n" | Set-Content -Path "$shimDir\vcvarsall.bat" -Encoding ASCII
          $diag.Add("shim $shimDir\vcvarsall.bat -> $fwd")

          $diag.Add("导出符号 $($names.Count) 项，def 首行 $($def[1])")
          $diag | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $diag | Out-File -Append heng-lib-diag.log -Encoding utf8

          $libOut = & cmd /c "call `"$vcvars`" >nul && cd /d `"$libDir`" && lib /def:heng.def /machine:X64 /out:heng.lib 2>&1"
          $libOut | Out-File -Append heng-lib-diag.log -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            "lib.exe 退出码 $LASTEXITCODE" | Out-File -Append heng-lib-diag.log -Encoding utf8
            throw "lib.exe 失败，退出码 $LASTEXITCODE"
          }
          if (-not (Test-Path "$libDir/heng.lib")) {
            "lib.exe 跑完但没有 heng.lib" | Out-File -Append heng-lib-diag.log -Encoding utf8
            throw "heng.lib 未生成"
          }

      - name: 编译 weasel
        shell: cmd
        run: |
          cd third_party\src\weasel
          rem build-x64.bat 里有三处 pause，靠重定向 stdin 让它立即返回而不是等输入。
          rem 它自己把 msbuild 输出写进 msbuild-x64.log，但脚本在前置步骤
          rem （build-core / vcvarsall / unlock-tsf）失败时那个文件还不存在，
          rem 所以把脚本的全部 stdout 也落盘，否则上传的 artifact 里什么都没有。
          rem build-x64.bat < NUL 的 1> 2> 重定向会把 pause 的提示也吃掉，无妨。
          build-x64.bat < NUL > weasel-build.log 2>&1
          set RC=%ERRORLEVEL%
          type weasel-build.log
          if exist msbuild-x64.log type msbuild-x64.log
          if %RC% neq 0 (
            echo ### build-x64.bat failed, ExitCode=%RC%>> %GITHUB_STEP_SUMMARY%
            exit /b %RC%
          )

      - name: 收集产物与日志
        # 合并成一步：upload-artifact@v4 在同一 job 内并发上传会互相取消，
        # 拆成「收集产物」+「上传日志」两步时后者静默变成no-op，
        # 表现为步骤 success 但 artifact 列表里没有它。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heng-windows
          path: |
            third_party/src/weasel/output/WeaselServer.exe
            third_party/src/weasel/output/WeaselDeployer.exe
            third_party/src/weasel/output/weaselx64.dll
            third_party/src/weasel/output/heng_core.dll
            third_party/src/weasel/output/rime.dll
            third_party/src/weasel/output/WinSparkle.dll
            third_party/src/weasel/msbuild-x64.log
            third_party/src/weasel/weasel-build.log
            *.log
          if-no-files-found: ignore

  # Linux 外壳：自研 fcitx5 addon，源码已入库，无需补丁重放。
  shell-linux:
    name: 外壳 Linux (fcitx5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config librime-dev libfontconfig1-dev \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 编译 core
        run: cargo build --release -p heng-core

      - name: 编译 addon
        run: |
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release shells/linux/fcitx5
          cmake --build build 2>&1 | tee cmake.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "### cmake --build 失败，末尾 40 行" >> "$GITHUB_STEP_SUMMARY"
            tail -40 cmake.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 校验产物
        run: |
          set -euo pipefail
           test -f build/libheng.so || { echo "addon 未产出"; exit 1; }
           # addon 通过 C ABI 调 core，链接期没报错即说明符号解析成功；
           # 这里再确认它确实指向 core 导出的入口
           nm -D build/libheng.so | grep -q heng_create \
             || { echo "addon 未引用 heng_create"; exit 1; }
           ldd build/libheng.so | grep -q "not found" \
             && { echo "有未解析的动态库依赖"; exit 1; } || true

      - name: 收集产物与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heng-linux
          path: |
            build/libheng.so
            target/release/libheng_core.so
            *.log
          if-no-files-found: ignore

  # macOS 外壳：squirrel 改造。改动固化在 patches/squirrel-heng.patch。
  shell-macos:
    name: 外壳 macOS (squirrel)
    # macos-26 而不是 macos-15：上游 squirrel 的 SquirrelPanel.swift 用了
    # NSGlassEffectView（macOS 26 新增），虽有 #available(macOS 26.0, *) 保护，
    # 但那只在运行时分支，编译期所有分支都要过——SDK 里没有这个类就编不过。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 安装 librime
        run: |
          curl -fL --retry 3 -o rime.tar.bz2 \
            "https://github.com/rime/librime/releases/download/1.17.0/rime-33e7814-macOS-universal.tar.bz2"
          mkdir -p third_party/librime
          if ! tar xjf rime.tar.bz2 -C third_party/librime; then
            echo "tar xjf 失败，改用 python3"
            python3 -c "import tarfile; tarfile.open('rime.tar.bz2').extractall('third_party/librime')"
          fi
          LIB=third_party/librime/dist/lib
          REAL=$(cd "$LIB" && ls librime.1.*.dylib | head -1)
          # squirrel 的 Makefile 要 lib/librime.1.dylib，core/build.rs 要 librime.dylib
          [ -e "$LIB/librime.1.dylib" ] || ln -s "$REAL" "$LIB/librime.1.dylib"
          [ -e "$LIB/librime.dylib" ] || ln -s librime.1.dylib "$LIB/librime.dylib"
          test -f "$LIB/librime.dylib"

          # opencc 数据与静态库在另一个资产里：主包只有 lib/(dylib) 与 bin/
          # (rime_deployer 等)，share/opencc/*.ocd2 和 lib/*.a 都在 rime-deps 包。
          # squirrel Makefile 的 RIME_DEPS 与 OPENCC_DATA 都指向后者。
          curl -fL --retry 3 -o rime-deps.tar.bz2 \
            "https://github.com/rime/librime/releases/download/1.17.0/rime-deps-33e7814-macOS-universal.tar.bz2"
          mkdir -p third_party/librime-deps
          tar xjf rime-deps.tar.bz2 -C third_party/librime-deps
          test -d third_party/librime-deps/share/opencc
          test -f third_party/librime-deps/share/opencc/TSCharacters.ocd2
          ls third_party/librime-deps/share/opencc | head -5

      - name: 克隆 squirrel 并重放补丁
        run: |
          set -euo pipefail
          # 基线是品牌图标定型 commit 6ad0e45b（作者为本项目），含 logo.svg
          git clone --depth 1 https://github.com/rime/squirrel third_party/src/squirrel
          cd third_party/src/squirrel
          git fetch --depth 1 origin 6ad0e45bcf53b770474100c02cec43912f0da502
          git checkout 6ad0e45bcf53b770474100c02cec43912f0da502
          git apply ../../../patches/squirrel-heng.patch
          # 只拉 Sparkle 与 plum。librime 那个 submodule 不初始化——
          # 编译用的是仓库 third_party/librime 下的官方预编译包，
          # 拉源码既慢且与core/build.rs 找的位置冲突。
          git submodule update --init --recursive Sparkle plum

      # squirrel 的 HEADER_SEARCH_PATHS 里写了 $(SRCROOT)/librime/include，
      # 而 sources/Squirrel-Bridging-Header.h 要 #import <rime/key_table.h>。
      # 那个 submodule 不初始化（编译用仓库 third_party/librime 的官方包），
      # 但 key_table.h 是 librime 的内部头，两个官方预编译包里都没有——
      # 只有源码树 src/rime/ 下有，所以按 squirrel .gitmodules 记的
      # 那个 revision（33e7814）从 raw 取那一个文件。
      # 它的依赖只有 <X11/keysym.h> 与 <rime_api.h>：
      # 前者在 rime-deps 包的 include/X11/，后者在主包 dist/include/。
      - name: 铺 librime 头文件到 squirrel
        run: |
          set -euo pipefail
          SQ="$GITHUB_WORKSPACE/third_party/src/squirrel"
          mkdir -p "$SQ/librime/include/rime"
          # 公开 API 头（rime_api.h 等）—— 主包 dist/include/ 直接给
          cp "$GITHUB_WORKSPACE/third_party/librime/dist/include/"*.h "$SQ/librime/include/"
          # key_table.h 是内部头，只存在于源码树
          curl -fL --retry 3 -o "$SQ/librime/include/rime/key_table.h" \
            "https://raw.githubusercontent.com/rime/librime/33e7814/src/rime/key_table.h"
          test -f "$SQ/librime/include/rime/key_table.h"
          test -f "$SQ/librime/include/rime_api.h"
          ls "$SQ/librime/include" "$SQ/librime/include/rime"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 编译 core
        run: cargo build --release -p heng-core

      - name: 同步 core 产物到 squirrel
        run: |
          # librime 解压在仓库的 third_party/librime（core/build.rs 从这里找），
          # squirrel 树内那个 librime/ 是它自己的 submodule 位置，两者不是同一份。
          #
          # 每个 run 步骤都从工作区根目录起算，之前的 cd 不跨步骤保留，
          # 所以这里必须用 $GITHUB_WORKSPACE 定位，不能写 ../../../。
          LR="$GITHUB_WORKSPACE/third_party/librime/dist"
          {
            echo "### librime dist: $LR"
            ls -l "$LR/lib" "$LR/bin"
          } >> "$GITHUB_STEP_SUMMARY" 2>&1
          cd third_party/src/squirrel
          mkdir -p lib librime/include bin
          # Makefile 的 DEPS_CHECK 要 lib/librime.1.dylib
          cp -L "$LR/lib/librime.1.dylib" lib/
          # BSD cp（macOS 自带）没有 -pR 参数，用 cp -R 兼容两边
          cp -R "$LR/lib/rime-plugins" lib/
          cp "$LR/bin/rime_deployer" bin/
          cp "$LR/bin/rime_dict_manager" bin/
          xcrun install_name_tool -add_rpath @loader_path/../Frameworks bin/rime_deployer
          xcrun install_name_tool -add_rpath @loader_path/../Frameworks bin/rime_dict_manager
          # 贴帧层经 bridging header 调这些符号，dylib 与头文件都要同步
          cp "$GITHUB_WORKSPACE/target/release/libheng_core.dylib" lib/
          cp "$GITHUB_WORKSPACE/core/include/heng.h" librime/include/heng.h
          ls -l lib/ librime/include/heng.h

      - name: 准备 plum 数据与 Sparkle
        run: |
          set -o pipefail
          cd third_party/src/squirrel
          # 诊断落盘，artifact 上传是外部唯一能读到这个步骤细节的途径。
          {
            echo "### plum 子模块"
            ls plum/ | head -20
            echo "### Sparkle 子模块"
            ls Sparkle/ | head -10
          } > "$GITHUB_WORKSPACE/mac-setup.log" 2>&1
          cat "$GITHUB_WORKSPACE/mac-setup.log"

          # make plum-data 而不是 copy-plum-data：后者只是 cp 一个已构建好的
          # plum/output，不负责构建 plum，源在但没产物时它会失败。
          # plum-data 自己会链到 copy-plum-data。
          #
          # bin/ 要先建：copy-plum-data 里的 `cp plum/rime-install bin/` 假定它
          # 已存在（上游由 make librime 建），而 CI 刻意跳过 make librime——
          # 编译用的是仓库 third_party/librime 下的官方预编译包。
          mkdir -p bin
          if ! make plum-data >> "$GITHUB_WORKSPACE/mac-setup.log" 2>&1; then
            echo "### make plum-data 失败" >> "$GITHUB_WORKSPACE/mac-setup.log"
            exit 1
          fi
          # 基线 commit 6ad0e45b 的 pbxproj 里有 3 处 heng.yaml 注册
          # （PBXBuildFile / PBXFileReference / Copy Shared Support Files），
          # path 写死为 data/plum/heng.yaml。文件本身不在 squirrel 仓库里，
          # 也不在 plum 预置包里，要从本项目 config-center 铺过去。
          # 少了这一步 xcodebuild 报 "The file "heng.yaml" couldn't be opened"。
          cp "$GITHUB_WORKSPACE/config-center/shared/heng.yaml" data/plum/
          test -f data/plum/heng.yaml
          # 不能用 make opencc-data：它跑的是 $(MAKE) -C librime deps/opencc，
          # 那是 librime submodule —— 而 CI 刻意不初始化它（编译用的是仓库
          # third_party/librime 下的官方预编译包）。opencc 数据在
          # rime-deps 包里，已解压到 third_party/librime-deps。
          mkdir -p data/opencc
          cp "$GITHUB_WORKSPACE/third_party/librime-deps/share/opencc/"* data/opencc/
          test -f data/opencc/TSCharacters.ocd2
          test -f data/opencc/t2s.json
          # RIME_DEPS 也要这几个静态库（libmarisa/libleveldb/libopencc/
          # libyaml-cpp.a）。它们在 librime submodule 里，而那个不初始化，
          # 所以从 rime-deps 包补到 librime/lib/—— 位置与上游一致，
          # 万一以后要跑 make librime 也不会缺料。
          mkdir -p librime/lib
          for a in libmarisa libleveldb libopencc libyaml-cpp; do
            cp "$GITHUB_WORKSPACE/third_party/librime-deps/lib/$a.a" librime/lib/
          done
          ls librime/lib
          # Sparkle.framework 是 DEPS_CHECK 的一项。
          # 用 make Frameworks/Sparkle.framework 而不是 make copy-sparkle-framework：
          # 后者只做 `cp -RP Sparkle/build/Release/Sparkle.framework Frameworks/`，
          # 不负责编译，而 Sparkle 的产物要 xcodebuild 才会出现。
          # 目标名（$(SPARKLE_FRAMEWORK)）那条规则还会自己 git submodule update，
          # 比make sparkle 更完整。
          if ! make Frameworks/Sparkle.framework >> "$GITHUB_WORKSPACE/mac-setup.log" 2>&1; then
            echo "### make Frameworks/Sparkle.framework 失败" >> "$GITHUB_WORKSPACE/mac-setup.log"
            exit 1
          fi

          # package/add_data_files 里有 `for file in data/plum/*`——它把该目录
          # 下所有文件注册进 pbxproj 的「Copy Shared Support Files」。
          # plum preset 只装了它那 8 个包（繁体注音那套），缺雾凇的
          # t9.schema.yaml / symbols_v.yaml / symbols_caps_v.yaml，
          # xcodebuild 会报 "The file couldn't be opened because there is
          # no such file"。把雾凇的方案与符号表铺进同一个目录。
          curl -fL --retry 3 -o "$GITHUB_WORKSPACE/rime-ice-full.zip" \
            "https://github.com/iDvel/rime-ice/releases/latest/download/full.zip"
          unzip -q -o "$GITHUB_WORKSPACE/rime-ice-full.zip" -d rime-ice
          for f in t9.schema.yaml symbols_v.yaml symbols_caps_v.yaml \
                   custom_phrase.txt cn_dicts en_dicts lua opencc; do
            test -e "rime-ice/$f" || { echo "雾凇包缺 $f" >> "$GITHUB_WORKSPACE/mac-setup.log"; exit 1; }
          done
          # 注意 fog 雾凇 full.zip 里没有 others/ 目录（本机 runtime 里有，
          # 那是另一次安装补的），所以不列进必需项。
          # 雾凇顶层除 yaml 还有 custom_phrase.txt，pbxproj 也注册了它，
          # 只 cp *.yaml 会漏掉——补齐 txt。
          cp rime-ice/*.yaml data/plum/ 2>/dev/null || true
          cp rime-ice/custom_phrase.txt data/plum/
          cp -R rime-ice/cn_dicts rime-ice/en_dicts rime-ice/lua rime-ice/opencc data/plum/
          # 雾凇的 default.yaml 列了 9 个方案，但 squirrel 的 Squirrel.app 里
          # 只随包带了 rime_ice 那套，其余 8 个（t9 + 7 个双拼）没有对应
          # schema 文件的话 librime 部署会以failure 收场。裁到只留 rime_ice。
          bash "$GITHUB_WORKSPACE/tools/ci/make_ci_default.sh" \
            data/plum/default.yaml data/plum/default.yaml

          # pbxproj 里静态注册了 52 个 data/plum/* 路径，xcodebuild 的 Copy
          # 阶段逐个去找，缺一个就整轮 BUILD FAILED，且失败点按注册顺序出现
          # —— 每次只能暴露下一个。改成在这里对着 pbxproj 的注册清单逐项核对，
          # 一次把缺的都列出来。
          missing=""
          for f in $(grep -o 'path = data/plum/[^;]*' Squirrel.xcodeproj/project.pbxproj \
                     | sed 's|path = data/plum/||' | sort -u); do
            [ -e "data/plum/$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "### pbxproj 注册但 data/plum 下没有：$missing" \
              >> "$GITHUB_WORKSPACE/mac-setup.log"
            echo "### 已铺：" >> "$GITHUB_WORKSPACE/mac-setup.log"
            ls data/plum >> "$GITHUB_WORKSPACE/mac-setup.log" 2>&1
            exit 1
          fi
          ls data/plum | head -30 >> "$GITHUB_WORKSPACE/mac-setup.log" 2>&1

      - name: 编译 Squirrel
        run: |
          set -o pipefail
          cd third_party/src/squirrel
          mkdir -p build
          # xcbeautify 不在 runner 上预装，直接用原始 xcodebuild 输出
          xcodebuild -project Squirrel.xcodeproj \
            -configuration Debug -scheme Squirrel \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | tee xcodebuild.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "### xcodebuild 失败，末尾 60 行" >> "$GITHUB_STEP_SUMMARY"
            tail -60 xcodebuild.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 收集产物与日志
        # 与 shell-windows 同理：v4 在同一 job 内并发上传会互相取消。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heng-macos
          path: |
            third_party/src/squirrel/build/Build/Products/Debug/Squirrel.app
            third_party/src/squirrel/xcodebuild.log
            *.log
          if-no-files-found: ignore