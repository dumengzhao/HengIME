[Metadata]
# 衡默认主题 heng_blue 的 fcitx5 复刻版。
# 色值来源：third_party/src/weasel/output/data/weasel.yaml 的 preset_color_schemes/heng_blue
# （Windows 小狼毫外壳与 Linux fcitx5 外壳共用同一套视觉）。
Name=Heng Blue
Name[zh_CN]=衡蓝
Author=HengIME
Version=1
Description=HengIME default theme: white panel, blue highlight pill, white text on selection

[InputPanel]
# 普通候选文字：黑
NormalColor=#000000ff
# 编码区（preedit）高亮文字：黑
HighlightColor=#000000ff
# 编码区高亮背景：浅灰（对应 weasel hilited_back_color）
HighlightBackgroundColor=#e8eaedff
# 选中候选文字：白色（蓝块之上）
HighlightCandidateColor=#ffffffff
# 序号（label）：淡灰；选中时白
CandidateLabelColor=#9c9c9cff
HighlightCandidateLabelColor=#ffffffff
# 注释（comment）：淡灰；选中时白
CandidateCommentColor=#b0b0b0ff
HighlightCandidateCommentColor=#ffffffff
# 序号/注释字号相对系数（对应 weasel label/comment_font_point 14/13 vs font 14）
LabelTextSizeFactor=100
CommentTextSizeFactor=93
# KWin 模糊关闭（纯色面板无需）
EnableBlur=False
# 竖排时高亮块不横贯整行（对齐「选中区域不要全部覆盖」的诉求）
FullWidthHighlight=False

[InputPanel/Background]
# 容器：纯白底，无边框
Color=#ffffffff
BorderColor=#00000000
BorderWidth=0

[InputPanel/Background/Margin]
Left=0
Right=0
Top=0
Bottom=0

# 选中候选高亮块：蓝色 #4F7CFE，无边框
[InputPanel/Highlight]
Color=#4f7cfeff
BorderColor=#00000000
BorderWidth=0

# 高亮块从文字区域向外膨胀：对应 weasel hilite_padding_x=8 / hilite_padding_y=4
[InputPanel/Highlight/Margin]
Left=8
Right=8
Top=4
Bottom=4

[InputPanel/Highlight/HighlightClickMargin]
Left=0
Right=0
Top=0
Bottom=0

# 内容区到容器壁：对应 weasel margin_x=14 / margin_y=10
# （高亮块离容器壁留白 = ContentMargin - Highlight/Margin = 6px，四边一致）
[InputPanel/ContentMargin]
Left=14
Right=14
Top=10
Bottom=10

# 候选条目文字边距：横排时左右决定候选间距（≈ weasel candidate_spacing 22），
# 上下决定行内余量
[InputPanel/TextMargin]
Left=11
Right=11
Top=5
Bottom=5

[InputPanel/ShadowMargin]
Left=0
Right=0
Top=0
Bottom=0

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[Menu]
NormalColor=#000000ff
HighlightCandidateColor=#ffffffff

[Menu/Background]
Color=#ffffffff
BorderColor=#00000000
BorderWidth=0

[Menu/Background/Margin]
Left=0
Right=0
Top=0
Bottom=0

[Menu/ContentMargin]
Left=8
Right=8
Top=6
Bottom=6

[Menu/TextMargin]
Left=8
Right=8
Top=4
Bottom=4

[Menu/Highlight]
Color=#4f7cfeff
BorderColor=#00000000
BorderWidth=0

[Menu/Highlight/Margin]
Left=8
Right=8
Top=4
Bottom=4
