[package]
name = "heng-core"
version.workspace = true
edition.workspace = true

[lib]
name = "heng_core"
# rlib：供本 workspace 内 Rust 侧使用；cdylib：产出 heng_core.dll 供各端外壳经 C ABI 调用
crate-type = ["rlib", "cdylib"]

[features]
# ui：Slint 自绘候选窗与设置窗，桌面三端需要。
# http：本机 HTTP 诊断服务（heng-cli serve 与设置窗的进程级动作依赖它）。
#
# 移动三端改用宿主原生框架绘制键盘与候选窗，两项都不需要：
#   cargo build --release --no-default-features -p heng-core
# 这样 slint（含软件渲染器）、axum、tokio 都不会进 aarch64 产物。
# 关闭时 ui 模块替换为 ui_stub.rs，C ABI 符号集合不变。
default = ["ui", "http"]
# feature 名与依赖名不同名（slint → ui），所以只能显式声明。
ui = ["dep:slint"]
http = ["dep:axum", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# 同步模块（六端常驻，无 feature 门控）：阻塞式 HTTP 客户端 + 快照摘要 +
# installation_id 随机段。
# ureq 关掉默认 tls：客户端只讲明文 HTTP，与自有中继的部署姿态一致，
# 同时避免把 OpenSSL/Schannel 拖进移动端产物。服务端可另行置于
# TLS 反代之后（浏览器访问 /admin 走 HTTPS），客户端侧暂不支持。
ureq = { version = "2", default-features = false, features = ["json"] }
sha2 = "0.10"
getrandom = "0.3"

axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net"], optional = true }

slint = { version = "1", default-features = false, optional = true, features = [
    "std",
    "compat-1-2",
    "renderer-software",
    "software-renderer-systemfonts",
] }
# getrandom 由 sync.rs（installation_id 随机段）与 server.rs（会话 token）共用。

# macOS 后端（M-P4）：core 只负责 slint 渲染，窗口贴帧交给外壳主线程
# （AppKit 窗口调用必须在主线程，而 UI 线程是 core 自己 spawn 的 Rust 线程）。
# 故此处**不引任何 objc/AppKit 依赖** —— 保持 core 平台无关。
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
] }
